[project]
name = "text-grad"
version = "0.1.0"
description = "TextGrad wrapper module for optimization and LangGraph integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textgrad>=0.1.6",
    "langgraph>=0.0.0",  # Optional, for LangGraph integration
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_grad_module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
